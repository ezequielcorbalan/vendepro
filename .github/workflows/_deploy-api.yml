# trigger: 2026-04-22
name: _deploy-api (reusable)

on:
  workflow_call:
    inputs:
      api_name:
        description: "Package name, e.g. api-auth"
        type: string
        required: true
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      GEMINI_API_KEY:
        required: false
      GROQ_API_KEY:
        required: false
      RESEND_API_KEY:
        required: false
      SMOKE_EMAIL:
        required: true
      SMOKE_PASSWORD:
        required: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vendepro-backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: vendepro-backend

      - name: Run all tests
        # --concurrency=1: evita flake de miniflare al correr varios paquetes en
        # paralelo. Los tests pasan individualmente; el throughput agregado es ~30-40s.
        run: npx turbo run test --concurrency=1
        working-directory: vendepro-backend
        env:
          CI: true

  deploy:
    name: Deploy ${{ inputs.api_name }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vendepro-backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: vendepro-backend

      - name: Deploy
        run: npx wrangler deploy
        working-directory: vendepro-backend/packages/${{ inputs.api_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Corre despues del deploy: si el sync falla (token, worker inexistente),
      # el codigo nuevo ya esta en produccion y el run marca el error igual.
      # Antes iba primero y un fallo aca bloqueaba todos los deploys de api-ai
      # (fallando desde 2026-06-06 sin dejar salir codigo nuevo).
      - name: Sync app secrets to worker
        working-directory: vendepro-backend/packages/${{ inputs.api_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          # sync <NOMBRE> <valor>: sube el secret si tiene valor y, si no, lo dice.
          # El silencio era el problema: ANTHROPIC_API_KEY estuvo AUSENTE del worker
          # vendepro-api-ai (verificado con `wrangler secret list` el 2026-09-02),
          # con las 4 features de IA de Anthropic caidas en produccion y todos los
          # deploys en verde, porque un secret vacio simplemente se salteaba.
          sync() {
            if [ -n "$2" ]; then
              printf '%s' "$2" | npx wrangler secret put "$1"
            else
              echo "::warning::$1 no esta seteado en los secrets del repo — se saltea el sync. Si esta API lo necesita, la feature va a fallar en runtime."
            fi
          }
          # Las 6 features de IA (vision, extraccion y generacion): api-ai.
          sync GEMINI_API_KEY "$GEMINI_API_KEY"
          # Extraccion de contratos de alquiler: api-rentals.
          sync GROQ_API_KEY "$GROQ_API_KEY"
          # Envio de emails: api-auth (recuperar contrasena) y api-crm (marketing).
          sync RESEND_API_KEY "$RESEND_API_KEY"

  smoke:
    name: Production smoke (${{ inputs.api_name }})
    runs-on: ubuntu-latest
    needs: deploy
    # Serializa el smoke entre los 8 workflows de API: todos comparten este group,
    # así los smokes nunca corren en paralelo contra prod. Un cambio en core/infra
    # dispara los 8 deploys a la vez; sin esto, 8 smokes concurrentes saturaban
    # crm.api ("Worker exceeded resource limits"). cancel-in-progress: false ⇒
    # hacen cola y corren de a uno (cada worker se valida y puede auto-rollback).
    concurrency:
      group: prod-smoke
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vendepro-backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: vendepro-backend

      - name: Run state-machine smoke against production
        run: npm run smoke:prod
        working-directory: vendepro-backend
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          CI: "true"

      - name: Upload smoke JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results-${{ inputs.api_name }}-${{ github.run_id }}
          path: vendepro-backend/packages/smoke-prod/smoke-results.xml
          if-no-files-found: warn

  rollback:
    name: Rollback ${{ inputs.api_name }}
    runs-on: ubuntu-latest
    needs: smoke
    # Only roll back if the smoke step itself failed. Skipped/cancelled runs leave
    # production alone — operator intervention can still trigger wrangler rollback
    # manually from Cloudflare Dashboard.
    if: failure() && needs.smoke.result == 'failure'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vendepro-backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: vendepro-backend

      - name: Roll back worker to previous deployment
        run: |
          npx wrangler rollback --message "Auto-rollback: state-machine smoke failed for ${{ github.sha }}"
        working-directory: vendepro-backend/packages/${{ inputs.api_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
