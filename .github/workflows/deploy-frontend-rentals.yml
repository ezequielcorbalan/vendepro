name: Deploy vendepro-frontend-rentals

on:
  push:
    branches: [main]
    paths:
      - "vendepro-frontend-rentals/**"
      - ".github/workflows/deploy-frontend-rentals.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy alquileres.vendepro.com.ar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install
        working-directory: vendepro-frontend-rentals

      - name: Build (Next.js)
        run: npx next build
        working-directory: vendepro-frontend-rentals
        env:
          NEXT_PUBLIC_API_URL: https://rentals.api.vendepro.com.ar
          NEXT_PUBLIC_USE_MOCK: "false"

      - name: Build (OpenNext for Cloudflare)
        run: npx opennextjs-cloudflare build
        working-directory: vendepro-frontend-rentals

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        working-directory: vendepro-frontend-rentals
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
